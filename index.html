<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arshia Hemmat</title>
  <meta name="description" content="Arshia Hemmat — MSc Oxford, Incoming PhD Cambridge. Researcher in AI for Biology.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* =============================================
       RESET
    ============================================= */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0a0a0a;
      --bg2:    #111111;
      --border: #1f1f1f;
      --text:   #ededed;
      --muted:  #808080;
      --dim:    #3a3a3a;
      --accent: #e8c547;
      --green:  #4ade80;
    }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.6;
    }

    /* =============================================
       TERMINAL INTRO
    ============================================= */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      transition: opacity .7s ease;
    }

    #intro.out {
      opacity: 0;
      pointer-events: none;
    }

    #skip {
      position: absolute;
      top: 24px;
      right: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      background: none;
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      letter-spacing: .06em;
      transition: color .15s, border-color .15s;
    }

    #skip:hover { color: var(--muted); border-color: var(--dim); }

    #terminal {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(13px, 2vw, 15px);
      line-height: 1.9;
      color: var(--green);
      max-width: 520px;
      width: 100%;
    }

    .t-prompt  { color: var(--dim); }
    .t-cmd     { color: var(--green); }
    .t-out     { color: color-mix(in srgb, var(--green) 55%, transparent); }
    .t-cursor  {
      display: inline-block;
      width: 9px;
      height: 1.1em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink .9s step-end infinite;
      margin-left: 1px;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* =============================================
       MAIN
    ============================================= */
    #main {
      opacity: 0;
      transition: opacity .8s ease;
      max-width: 680px;
      margin: 0 auto;
      padding: 80px 28px 120px;
    }

    #main.in { opacity: 1; }

    /* =============================================
       HERO
    ============================================= */
    .hero {
      margin-bottom: 72px;
    }

    .hero-name {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.05;
      color: var(--text);
      margin-bottom: 14px;
    }

    .hero-affiliations {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 24px;
    }

    .aff-line {
      font-size: 14.5px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: .01em;
    }

    .aff-oxford {
      color: #6cb4c8;
    }

    .aff-line .gold-dot {
      color: var(--accent);
      margin-right: 6px;
      font-size: 16px;
      line-height: 1;
      vertical-align: middle;
    }

    .hero-bio {
      font-size: 15.5px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 580px;
      margin-bottom: 32px;
    }

    .hero-bio strong {
      color: var(--text);
      font-weight: 500;
    }

    /* =============================================
       LINK BUTTONS
    ============================================= */
    .links-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .lnk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 13px;
      border-radius: 6px;
      border: 1px solid var(--border);
      color: var(--muted);
      background: transparent;
      text-decoration: none;
      transition: color .15s, border-color .15s;
      white-space: nowrap;
    }

    .lnk svg { width: 14px; height: 14px; flex-shrink: 0; }
    .lnk:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

    .lnk-primary {
      color: var(--bg);
      background: var(--text);
      border-color: var(--text);
    }

    .lnk-primary:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--bg);
    }

    /* =============================================
       SECTIONS
    ============================================= */
    .section {
      padding-top: 52px;
      border-top: 1px solid var(--border);
      margin-bottom: 0;
    }

    .section + .section { margin-top: 0; }

    .section-label {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.01em;
      text-transform: none;
      color: var(--text);
      margin-bottom: 28px;
    }

    /* =============================================
       SCROLL REVEAL
    ============================================= */
    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity .55s ease, transform .55s ease;
    }

    .reveal.shown { opacity: 1; transform: translateY(0); }

    /* =============================================
       NEWS
    ============================================= */
    .news-list { display: flex; flex-direction: column; }

    .news-row {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 20px;
      padding: 14px 14px;
      border-radius: 7px;
      margin: 0 -14px;
      transition: background .15s;
    }

    .news-row:hover { background: var(--bg2); }

    .news-row.highlight {
      border-left: 2px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 5%, transparent);
      padding-left: 16px;
      margin-left: -16px;
    }

    .news-row.highlight:hover {
      background: color-mix(in srgb, var(--accent) 9%, transparent);
    }

    .news-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #555;
      padding-top: 3px;
      white-space: nowrap;
    }

    .news-text {
      font-size: 16px;
      color: #c8c8c8;
      line-height: 1.7;
    }

    .news-row.highlight .news-text { color: var(--text); }

    .news-text strong { color: var(--text); font-weight: 600; }

    .news-text a {
      font-size: 12px;
      color: #555;
      margin-left: 10px;
      transition: color .15s;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .03em;
    }

    .news-text a:hover { color: var(--accent); text-decoration: none; }

    /* =============================================
       PUBLICATIONS
    ============================================= */
    .filter-row {
      display: flex;
      gap: 6px;
      margin-bottom: 28px;
    }

    .f-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all .15s;
    }

    .f-btn:hover { border-color: var(--muted); color: var(--muted); }

    .f-btn.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg);
    }

    .pub-list { display: flex; flex-direction: column; }

    .pub-item {
      padding: 22px 14px;
      border-radius: 9px;
      margin: 0 -14px;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }

    .pub-item:first-child { border-top: 1px solid var(--border); }
    .pub-item:hover { background: var(--bg2); }

    .pub-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }

    .pub-venue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .pub-role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #666;
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: .04em;
    }

    .pub-role-lead {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }

    .pub-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 8px;
      letter-spacing: -.015em;
    }

    .pub-authors {
      font-size: 13.5px;
      color: #666;
      margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .01em;
      line-height: 1.6;
    }

    .pub-authors .me {
      color: var(--accent);
      font-weight: 500;
    }

    .pub-desc {
      font-size: 15px;
      color: #909090;
      line-height: 1.75;
      margin-bottom: 14px;
    }

    .pub-links { display: flex; gap: 8px; }

    .pub-lnk {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 5px;
      text-decoration: none;
      transition: all .15s;
    }

    .pub-lnk:hover {
      color: var(--accent);
      border-color: var(--accent);
      text-decoration: none;
    }

    /* =============================================
       CONTACT
    ============================================= */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .contact-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px 20px;
      transition: border-color .15s;
    }

    .contact-box:hover { border-color: var(--dim); }

    .contact-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 9px;
    }

    .contact-body {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .contact-cta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--dim);
      text-decoration: none;
      letter-spacing: .04em;
      transition: color .15s;
    }

    .contact-cta:hover { color: var(--accent); text-decoration: none; }

    /* =============================================
       FOOTER
    ============================================= */
    .footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .footer-copy {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      letter-spacing: .05em;
    }

    .footer a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--dim);
      text-decoration: none;
      transition: color .15s;
    }

    .footer a:hover { color: var(--muted); }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 560px) {
      #main { padding: 60px 20px 80px; }
      .contact-grid { grid-template-columns: 1fr; }
      .news-row { grid-template-columns: 72px 1fr; gap: 12px; }
    }
  </style>
</head>
<body>

<!-- =============================================
     TERMINAL INTRO
============================================= -->
<div id="intro">
  <button id="skip">skip</button>
  <div id="terminal"></div>
</div>

<!-- =============================================
     MAIN
============================================= -->
<div id="main">

  <!-- HERO -->
  <header class="hero reveal">
    <h1 class="hero-name">Arshia Hemmat</h1>
    <div class="hero-affiliations">
      <span class="aff-line"><span class="aff-oxford">MSc Advanced Computer Science &middot; Oxford University</span></span>
      <span class="aff-line"><span class="gold-dot">&middot;</span>Incoming PhD &middot; University of Cambridge</span>

  <!-- PUBLICATIONS -->
  <section class="section reveal" id="publications">

  <section class="section reveal" id="contact">

  <footer class="footer">

  </footer>

</div>

<!-- =============================================
     SCRIPTS
============================================= -->
<script src="content.js"></script>
<script>
'use strict';

/* ── TERMINAL ─────────────────────────────────────── */
const LINES = [
  { type: 'cmd',  text: 'whoami' },
  { type: 'out',  text: '> arshia hemmat' },
  { type: 'gap' },
  { type: 'cmd',  text: 'cat research.txt' },
  { type: 'out',  text: '> AI for Biology' },
  { type: 'out',  text: '> Trustworthy Multimodal AI' },
  { type: 'gap' },
  { type: 'cmd',  text: 'ls affiliations/' },
  { type: 'out',  text: '> oxford/   cambridge/   torr_vision_group/   wellcome_sanger/' },
  { type: 'gap' },
  { type: 'cmd',  text: './load_profile.sh' },
  { type: 'out',  text: '> loading ...' },
];

const CHAR_DELAY   = 32;
const LINE_PAUSE   = 340;
const OUT_PAUSE    = 90;
const FINAL_HOLD   = 500;

const termEl   = document.getElementById('terminal');
const introEl  = document.getElementById('intro');
const mainEl   = document.getElementById('main');
let   skipped  = false;

function showMain() {
  introEl.classList.add('out');
  setTimeout(() => {
    introEl.style.display = 'none';
    mainEl.classList.add('in');
    triggerReveal();
  }, 720);
}

document.getElementById('skip').addEventListener('click', () => {
  skipped = true;
  showMain();
});

async function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function typeLine(el, text) {
  for (const ch of text) {
    if (skipped) { el.textContent = text; return; }
    el.textContent += ch;
    await sleep(CHAR_DELAY);
  }
}

async function runTerminal() {
  for (const line of LINES) {
    if (skipped) break;

    if (line.type === 'gap') {
      termEl.appendChild(document.createElement('br'));
      await sleep(OUT_PAUSE);
      continue;
    }

    const row = document.createElement('div');

    if (line.type === 'cmd') {
      const prompt = document.createElement('span');
      prompt.className = 't-prompt';
      prompt.textContent = '$ ';
      row.appendChild(prompt);

      const cmd = document.createElement('span');
      cmd.className = 't-cmd';
      row.appendChild(cmd);

      const cursor = document.createElement('span');
      cursor.className = 't-cursor';
      row.appendChild(cursor);
      termEl.appendChild(row);

      await sleep(LINE_PAUSE * .4);
      await typeLine(cmd, line.text);
      cursor.remove();
      await sleep(LINE_PAUSE);

    } else {
      row.className = 't-out';
      termEl.appendChild(row);
      await typeLine(row, line.text);
      await sleep(OUT_PAUSE);
    }
  }

  if (!skipped) {
    await sleep(FINAL_HOLD);
    showMain();
  }
}

runTerminal();


/* ── SCROLL REVEAL ────────────────────────────────── */
function triggerReveal() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('shown');
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });

  document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
}


/* ── HERO ─────────────────────────────────────────── */
document.getElementById('yr').textContent             = new Date().getFullYear();
document.getElementById('footer-scholar').href         = profileData.scholarLink;

document.getElementById('hero-bio').innerHTML = profileData.bio
  .replace('AI for Biology', '<strong>AI for Biology</strong>')
  .replace('University of Cambridge', '<strong>University of Cambridge</strong>')
  .replace('Wellcome Sanger', '<strong>Wellcome Sanger</strong>')
  .replace('Oxford', '<strong>Oxford</strong>');

const ICONS = {
  cv:       `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M7 21h10a2 2 0 002-2V7l-5-5H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`,
  email:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`,
  scholar:  `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 24a7 7 0 1 1 0-14 7 7 0 0 1 0 14zm0-24L0 9.5l4.838 3.94A8 8 0 0 1 12 9a8 8 0 0 1 7.162 4.44L24 9.5z"/></svg>`,
  github:   `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.05-.015-2.055-3.33.72-4.035-1.605-4.035-1.605-.54-1.38-1.335-1.755-1.335-1.755-1.087-.735.09-.72.09-.72 1.2.09 1.83 1.23 1.83 1.23 1.065 1.815 2.805 1.29 3.495.99.105-.765.42-1.29.765-1.59-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.285 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>`,
  linkedin: `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>`,
};

const linksRow = document.getElementById('links-row');
[
  { key: 'cv',       label: 'Download CV', href: profileData.cvLink,         primary: true  },
  { key: 'email',    label: 'Email',       href: 'mailto:' + profileData.email               },
  { key: 'scholar',  label: 'Scholar',     href: profileData.scholarLink,     blank: true    },
  { key: 'github',   label: 'GitHub',      href: profileData.githubLink,      blank: true    },
  { key: 'linkedin', label: 'LinkedIn',    href: profileData.linkedinLink,    blank: true    },
].forEach(l => {
  const a = document.createElement('a');
  a.className   = 'lnk' + (l.primary ? ' lnk-primary' : '');
  a.href        = l.href;
  a.innerHTML   = ICONS[l.key] + `<span>${l.label}</span>`;
  if (l.blank)  a.target = '_blank';
  linksRow.appendChild(a);
});


/* ── NEWS ─────────────────────────────────────────── */
const newsList = document.getElementById('news-list');
newsData.forEach(item => {
  const row        = document.createElement('div');
  const isHighlight = item.badge === 'milestone';
  row.className    = 'news-row' + (isHighlight ? ' highlight' : '');

  const link = item.link
    ? `<a href="${item.link}" target="_blank">[paper]</a>` : '';

  row.innerHTML = `
    <span class="news-date">${item.date}</span>
    <span class="news-text">${item.content}${link}</span>
  `;
  newsList.appendChild(row);
});


/* ── PUBLICATIONS ─────────────────────────────────── */
function highlightMe(authors) {
  return authors
    .replace(/Arshia Hemmat/g, '<span class="me">Arshia Hemmat</span>')
    .replace(/A\. Hemmat/g,    '<span class="me">A. Hemmat</span>')
    .replace(/A Hemmat/g,      '<span class="me">A Hemmat</span>');
}

function renderPubs(filter) {
  const list   = document.getElementById('pub-list');
  const papers = filter === 'selected' ? selectedPapers : allPublications;
  list.innerHTML = '';

  papers.forEach(p => {
    const links = (p.links || []).map(l =>
      `<a href="${l.url}" target="_blank" class="pub-lnk">${l.text}</a>`
    ).join('');

    const div       = document.createElement('div');
    div.className   = 'pub-item';
    div.innerHTML   = `
      <div class="pub-meta">
        <span class="pub-venue">${p.venue}</span>
        <span class="pub-role ${p.role.toLowerCase().includes('first author') ? 'pub-role-lead' : ''}">${p.role}</span>
      </div>
      <p class="pub-title">${p.title}</p>
      <p class="pub-authors">${highlightMe(p.authors)}</p>
      <p class="pub-desc">${p.description}</p>
      ${links ? `<div class="pub-links">${links}</div>` : ''}
    `;
    list.appendChild(div);
  });
}

document.querySelector('.filter-row').addEventListener('click', e => {
  const btn = e.target.closest('.f-btn');
  if (!btn) return;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderPubs(btn.dataset.filter);
});

renderPubs('selected');


/* ── CONTACT ──────────────────────────────────────── */
const contactGrid = document.getElementById('contact-grid');
[
  { title: supportData.mentorshipTitle, body: supportData.mentorshipText, cta: 'get_in_touch()' },
  { title: supportData.collabTitle,     body: supportData.collabText,     cta: 'contact_me()'   },
].forEach(b => {
  contactGrid.innerHTML += `
    <div class="contact-box">
      <p class="contact-title">${b.title}</p>
      <p class="contact-body">${b.body}</p>
      <a href="mailto:${profileData.email}" class="contact-cta">${b.cta}</a>
    </div>`;
});
</script>
</body>
