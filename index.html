<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshia Hemmat</title>
    <meta name="description" content="Arshia Hemmat — Incoming PhD, University of Cambridge. AI for Biology.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:       #ffffff;
            --surface:  #f7f7f5;
            --border:   #e5e5e2;
            --text:     #1a1a18;
            --muted:    #6b6b66;
            --accent:   #1d4ed8;
            --accent-h: #1e40af;
            --tag-bg:   #f0f0ee;
            --tag-text: #44443f;
        }

        html { font-size: 16px; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-h); text-decoration: underline; }

        /* ── Layout ──────────────────────────────── */
        .page {
            max-width: 760px;
            margin: 0 auto;
            padding: 64px 24px 96px;
        }

        /* ── Divider ─────────────────────────────── */
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 56px 0;
        }

        /* ── Section label ───────────────────────── */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 24px;
        }

        /* ── Hero ────────────────────────────────── */
        .hero {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .hero-photo {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .hero-body { flex: 1; }

        .hero-name {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.2;
            margin-bottom: 4px;
        }

        .hero-title {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 14px;
        }

        .hero-bio {
            font-size: 15px;
            color: #3a3a36;
            max-width: 560px;
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .hero-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            color: var(--text);
            background: var(--bg);
            cursor: pointer;
            transition: background .15s, border-color .15s;
            text-decoration: none;
        }
        .btn:hover { background: var(--surface); border-color: #ccc; text-decoration: none; color: var(--text); }

        .btn-primary {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }
        .btn-primary:hover { background: #333; border-color: #333; color: #fff; }

        /* ── News ────────────────────────────────── */
        .news-list { display: flex; flex-direction: column; gap: 0; }

        .news-item {
            display: grid;
            grid-template-columns: 80px 1fr;
            gap: 16px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .news-item:first-child { border-top: 1px solid var(--border); }

        .news-date {
            color: var(--muted);
            font-size: 13px;
            padding-top: 1px;
            font-variant-numeric: tabular-nums;
        }

        .news-content { color: var(--text); line-height: 1.55; }
        .news-content strong { font-weight: 600; }
        .news-link {
            font-size: 12px;
            margin-left: 6px;
            color: var(--accent);
        }
        .news-link:hover { color: var(--accent-h); }

        /* ── Publications ────────────────────────── */
        .pub-list { display: flex; flex-direction: column; gap: 28px; }

        .pub-item { display: flex; flex-direction: column; gap: 4px; }

        .pub-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pub-venue {
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: .04em;
        }

        .pub-role {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 2px 7px;
            border-radius: 4px;
        }

        .pub-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
        }

        .pub-authors {
            font-size: 13px;
            color: var(--muted);
        }

        .pub-desc {
            font-size: 13px;
            color: #4a4a46;
            line-height: 1.6;
        }

        .pub-links {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .pub-link {
            font-size: 12px;
            font-weight: 500;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 4px;
            transition: background .15s;
            text-decoration: none;
        }
        .pub-link:hover { background: var(--surface); text-decoration: none; }

        /* ── Filter tabs ─────────────────────────── */
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 28px;
        }

        .filter-btn {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--muted);
            cursor: pointer;
            transition: all .15s;
        }
        .filter-btn:hover { border-color: #aaa; color: var(--text); }
        .filter-btn.active {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        /* ── CTA boxes ───────────────────────────── */
        .cta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .cta-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 24px;
        }

        .cta-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .cta-text {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .cta-link {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
        }
        .cta-link:hover { text-decoration: underline; }

        /* ── Footer ──────────────────────────────── */
        footer {
            margin-top: 80px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        footer a { color: var(--muted); }
        footer a:hover { color: var(--text); }

        /* ── Responsive ──────────────────────────── */
        @media (max-width: 580px) {
            .hero { flex-direction: column; gap: 20px; }
            .hero-photo { width: 80px; height: 80px; }
            .hero-name { font-size: 22px; }
            .cta-grid { grid-template-columns: 1fr; }
            .news-item { grid-template-columns: 70px 1fr; gap: 10px; }
        }
    </style>
</head>
<body>
<div class="page">

    <!-- ── Hero ─────────────────────────────────── -->
    <header class="hero">
        <img id="profile-image" src="images/profile.jpg" alt="Arshia Hemmat" class="hero-photo">
        <div class="hero-body">
            <h1 class="hero-name">Arshia Hemmat</h1>
            <p id="hero-title" class="hero-title"></p>
            <p id="hero-bio" class="hero-bio"></p>
            <div class="hero-links">
                <a id="link-cv" href="" class="btn btn-primary">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    CV
                </a>
                <a href="mailto:amirarshia.hemmat@kellogg.ox.ac.uk" class="btn">Email</a>
                <a id="link-scholar" href="" target="_blank" class="btn">Scholar</a>
                <a id="link-github" href="" target="_blank" class="btn">GitHub</a>
                <a id="link-linkedin" href="" target="_blank" class="btn">LinkedIn</a>
            </div>
        </div>
    </header>

    <hr class="divider">

    <!-- ── News ─────────────────────────────────── -->
    <section>
        <p class="section-label">News</p>
        <div id="news-list" class="news-list"></div>
    </section>

    <hr class="divider">

    <!-- ── Publications ──────────────────────────── -->
    <section>
        <p class="section-label">Selected Publications</p>

        <div class="filter-row" id="filter-row">
            <button class="filter-btn active" data-filter="selected">Selected</button>
            <button class="filter-btn" data-filter="all">All</button>
        </div>

        <div id="pub-list" class="pub-list"></div>
    </section>

    <hr class="divider">

    <!-- ── CTA ───────────────────────────────────── -->
    <div class="cta-grid">
        <div class="cta-box">
            <p id="cta-mentor-title" class="cta-title"></p>
            <p id="cta-mentor-text" class="cta-text"></p>
            <a id="cta-mentor-link" href="" class="cta-link">Get in touch &rarr;</a>
        </div>
        <div class="cta-box">
            <p id="cta-collab-title" class="cta-title"></p>
            <p id="cta-collab-text" class="cta-text"></p>
            <a id="cta-collab-link" href="" class="cta-link">Contact me &rarr;</a>
        </div>
    </div>

    <!-- ── Footer ────────────────────────────────── -->
    <footer>
        <span>&copy; <span id="year"></span> Arshia Hemmat</span>
        <a id="footer-scholar" href="" target="_blank">Google Scholar</a>
    </footer>

</div>

<script src="content.js"></script>
<script>
    // ── Profile ──────────────────────────────────
    document.getElementById('hero-title').textContent   = profileData.title;
    document.getElementById('hero-bio').textContent     = profileData.bio;
    document.getElementById('link-cv').href             = profileData.cvLink;
    document.getElementById('link-scholar').href        = profileData.scholarLink;
    document.getElementById('link-github').href         = profileData.githubLink;
    document.getElementById('link-linkedin').href       = profileData.linkedinLink;
    document.getElementById('footer-scholar').href      = profileData.scholarLink;
    document.getElementById('year').textContent         = new Date().getFullYear();

    // ── News ─────────────────────────────────────
    const newsList = document.getElementById('news-list');
    newsData.forEach(item => {
        const linkHtml = item.link
            ? `<a href="${item.link}" target="_blank" class="news-link">Paper &rarr;</a>`
            : '';
        newsList.innerHTML += `
            <div class="news-item">
                <span class="news-date">${item.date}</span>
                <span class="news-content">${item.content}${linkHtml}</span>
            </div>`;
    });

    // ── Publications ─────────────────────────────
    let activeFilter = 'selected';

    function renderPubs(filter) {
        const list   = document.getElementById('pub-list');
        const papers = filter === 'selected' ? selectedPapers : allPublications;
        list.innerHTML = '';
        papers.forEach(p => {
            const links = p.links.map(l =>
                `<a href="${l.url}" target="_blank" class="pub-link">${l.text}</a>`
            ).join('');
            list.innerHTML += `
                <div class="pub-item">
                    <div class="pub-meta">
                        <span class="pub-venue">${p.venue}</span>
                        <span class="pub-role">${p.role}</span>
                    </div>
                    <p class="pub-title">${p.title}</p>
                    <p class="pub-authors">${p.authors}</p>
                    <p class="pub-desc">${p.description}</p>
                    ${links ? `<div class="pub-links">${links}</div>` : ''}
                </div>`;
        });
    }

    document.getElementById('filter-row').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPubs(btn.dataset.filter);
    });

    renderPubs('selected');

    // ── CTA ──────────────────────────────────────
    document.getElementById('cta-mentor-title').textContent = supportData.mentorshipTitle;
    document.getElementById('cta-mentor-text').textContent  = supportData.mentorshipText;
    document.getElementById('cta-mentor-link').href         = 'mailto:' + profileData.email;
    document.getElementById('cta-collab-title').textContent = supportData.collabTitle;
    document.getElementById('cta-collab-text').textContent  = supportData.collabText;
    document.getElementById('cta-collab-link').href         = 'mailto:' + profileData.email;
</script>
</body>
</html>
