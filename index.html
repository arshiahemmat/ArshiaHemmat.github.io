<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshia Hemmat</title>
    <meta name="description" content="Arshia Hemmat — Incoming PhD, University of Cambridge. Researcher in AI for Biology.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #faf9f6;
            --surface:   #f2f1ed;
            --border:    #e4e2dd;
            --text:      #1a1917;
            --muted:     #78766f;
            --faint:     #aea9a0;
            --accent:    #1a56db;
            --accent-d:  #1141b0;
            --highlight: #fef3c7;
            --sidebar-w: 230px;
            --gap:        56px;
        }

        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-d); text-decoration: underline; text-underline-offset: 3px; }

        /* ── Page shell ──────────────────────────── */
        .shell {
            display: flex;
            max-width: 1020px;
            margin: 0 auto;
            padding: 0 32px;
            gap: var(--gap);
            align-items: flex-start;
        }

        /* ── Sidebar ─────────────────────────────── */
        .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            padding: 52px 0 40px;
            display: flex;
            flex-direction: column;
            gap: 0;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { display: none; }

        .sidebar-photo {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            display: block;
        }

        .sidebar-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.25;
            letter-spacing: -.01em;
            margin-bottom: 5px;
        }

        .sidebar-title {
            font-size: 12.5px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 18px;
        }

        .sidebar-sep {
            border: none;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }

        .sidebar-bio {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 0;
        }

        /* Sidebar nav */
        .sidebar-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav a {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            padding: 5px 8px;
            border-left: 2px solid transparent;
            border-radius: 0 4px 4px 0;
            transition: all .15s ease;
            text-decoration: none;
        }

        .sidebar-nav a:hover {
            color: var(--text);
            background: var(--surface);
            text-decoration: none;
        }

        .sidebar-nav a.active {
            color: var(--accent);
            border-left-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 6%, transparent);
        }

        /* Sidebar links */
        .sidebar-links {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            padding-top: 20px;
        }

        .sl-btn {
            font-size: 12px;
            font-weight: 500;
            padding: 5px 11px;
            border-radius: 5px;
            border: 1px solid var(--border);
            color: var(--muted);
            background: var(--bg);
            text-decoration: none;
            transition: all .15s ease;
            white-space: nowrap;
        }

        .sl-btn:hover {
            border-color: #c0bdb7;
            color: var(--text);
            background: var(--surface);
            text-decoration: none;
        }

        .sl-btn-primary {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .sl-btn-primary:hover {
            background: #333;
            border-color: #333;
            color: #fff;
        }

        /* ── Main content ────────────────────────── */
        .main {
            flex: 1;
            min-width: 0;
            padding: 52px 0 80px;
        }

        /* ── Section ─────────────────────────────── */
        .section { margin-bottom: 64px; }

        .section-heading {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--faint);
            margin-bottom: 22px;
        }

        /* ── News ────────────────────────────────── */
        .news-list { display: flex; flex-direction: column; }

        .news-row {
            display: grid;
            grid-template-columns: 88px 1fr;
            gap: 14px;
            padding: 11px 8px;
            border-radius: 5px;
            transition: background .12s ease;
            margin: 0 -8px;
        }

        .news-row:hover { background: var(--surface); }

        .news-row.milestone {
            background: var(--highlight);
        }
        .news-row.milestone:hover {
            background: #fde68a;
        }

        .news-date {
            font-size: 12.5px;
            color: var(--faint);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            padding-top: 1px;
            font-family: 'Inter', monospace;
        }

        .news-content {
            font-size: 13.5px;
            color: var(--text);
            line-height: 1.55;
        }

        .news-content strong { font-weight: 600; }

        .news-content a {
            font-size: 12px;
            margin-left: 6px;
            color: var(--accent);
        }

        /* ── Publications ────────────────────────── */
        .filter-row {
            display: flex;
            gap: 5px;
            margin-bottom: 24px;
        }

        .filter-btn {
            font-size: 12.5px;
            font-weight: 500;
            padding: 4px 13px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--muted);
            cursor: pointer;
            transition: all .15s ease;
            font-family: 'Inter', sans-serif;
        }

        .filter-btn:hover { border-color: #c0bdb7; color: var(--text); }

        .filter-btn.active {
            background: var(--text);
            border-color: var(--text);
            color: var(--bg);
        }

        .pub-list { display: flex; flex-direction: column; }

        .pub-item {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .pub-item:first-child { border-top: 1px solid var(--border); }

        .pub-meta {
            display: flex;
            align-items: center;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .pub-venue {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .05em;
            text-transform: uppercase;
            color: var(--accent);
        }

        .pub-role {
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1px 7px;
            border-radius: 3px;
        }

        .pub-title {
            font-size: 14.5px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            margin-bottom: 4px;
            letter-spacing: -.01em;
        }

        .pub-authors {
            font-size: 12.5px;
            color: var(--faint);
            margin-bottom: 6px;
        }

        .pub-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 10px;
        }

        .pub-links { display: flex; gap: 7px; flex-wrap: wrap; }

        .pub-link {
            font-size: 12px;
            font-weight: 500;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 3px 11px;
            border-radius: 4px;
            text-decoration: none;
            background: var(--bg);
            transition: all .15s ease;
        }

        .pub-link:hover {
            background: var(--surface);
            border-color: #c0bdb7;
            color: var(--text);
            text-decoration: none;
        }

        /* ── Contact ─────────────────────────────── */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .contact-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 22px 20px;
        }

        .contact-title {
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .contact-text {
            font-size: 12.5px;
            color: var(--muted);
            line-height: 1.65;
            margin-bottom: 14px;
        }

        .contact-link {
            font-size: 13px;
            font-weight: 500;
            color: var(--accent);
            text-decoration: none;
        }

        .contact-link:hover { color: var(--accent-d); text-decoration: underline; text-underline-offset: 3px; }

        /* ── Footer ──────────────────────────────── */
        .footer {
            padding: 24px 0 0;
            border-top: 1px solid var(--border);
            font-size: 12px;
            color: var(--faint);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer a { color: var(--faint); }
        .footer a:hover { color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }

        /* ── Mobile ──────────────────────────────── */
        @media (max-width: 700px) {
            .shell {
                flex-direction: column;
                padding: 0 20px;
                gap: 0;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                padding: 32px 0 0;
                flex-direction: column;
                gap: 0;
            }

            .sidebar-photo {
                width: 56px;
                height: 56px;
                border-radius: 50%;
            }

            .sidebar-links { padding-top: 12px; margin-bottom: 32px; }

            .sidebar-nav { display: none; }

            .main { padding: 32px 0 60px; }

            .contact-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="shell">

    <!-- ═══════════ SIDEBAR ═══════════ -->
    <aside class="sidebar">

        <img id="s-photo" src="images/profile.jpg" alt="Arshia Hemmat" class="sidebar-photo">

        <h1 class="sidebar-name">Arshia<br>Hemmat</h1>
        <p class="sidebar-title" id="s-title"></p>

        <hr class="sidebar-sep">

        <p class="sidebar-bio" id="s-bio"></p>

        <hr class="sidebar-sep">

        <nav>
            <ul class="sidebar-nav" id="sidebar-nav">
                <li><a href="#news"         data-section="news">News</a></li>
                <li><a href="#publications" data-section="publications">Publications</a></li>
                <li><a href="#contact"      data-section="contact">Contact</a></li>
            </ul>
        </nav>

        <div class="sidebar-links" id="s-links">
            <!-- filled by JS -->
        </div>

    </aside>

    <!-- ═══════════ MAIN ═══════════════ -->
    <main class="main">

        <!-- News -->
        <section class="section" id="news">
            <p class="section-heading">News</p>
            <div class="news-list" id="news-list"></div>
        </section>

        <!-- Publications -->
        <section class="section" id="publications">
            <p class="section-heading">Publications</p>
            <div class="filter-row" id="filter-row">
                <button class="filter-btn active" data-filter="selected">Selected</button>
                <button class="filter-btn" data-filter="all">All</button>
            </div>
            <div class="pub-list" id="pub-list"></div>
        </section>

        <!-- Contact -->
        <section class="section" id="contact">
            <p class="section-heading">Contact</p>
            <div class="contact-grid" id="contact-grid"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <span>&copy; <span id="year"></span> Arshia Hemmat</span>
            <a id="footer-scholar" href="" target="_blank">Google Scholar</a>
        </footer>

    </main>
</div>

<script src="content.js"></script>
<script>
// ── 1. Sidebar profile ─────────────────────────────────────
document.getElementById('s-title').textContent = profileData.title;
document.getElementById('s-bio').textContent   = profileData.bio;
document.getElementById('footer-scholar').href  = profileData.scholarLink;
document.getElementById('year').textContent     = new Date().getFullYear();

const linksData = [
    { text: 'CV',       href: profileData.cvLink,      primary: true  },
    { text: 'Email',    href: 'mailto:' + profileData.email           },
    { text: 'Scholar',  href: profileData.scholarLink, target: '_blank'},
    { text: 'GitHub',   href: profileData.githubLink,  target: '_blank'},
    { text: 'LinkedIn', href: profileData.linkedinLink,target: '_blank'},
];

const linksEl = document.getElementById('s-links');
linksData.forEach(l => {
    const a = document.createElement('a');
    a.className  = 'sl-btn' + (l.primary ? ' sl-btn-primary' : '');
    a.href       = l.href;
    a.textContent = l.text;
    if (l.target) a.target = l.target;
    linksEl.appendChild(a);
});

// ── 2. News ────────────────────────────────────────────────
const newsList = document.getElementById('news-list');
newsData.forEach(item => {
    const row      = document.createElement('div');
    row.className  = 'news-row' + (item.badge === 'milestone' ? ' milestone' : '');

    const linkHtml = item.link
        ? `<a href="${item.link}" target="_blank">Paper &rarr;</a>`
        : '';

    row.innerHTML = `
        <span class="news-date">${item.date}</span>
        <span class="news-content">${item.content}${linkHtml}</span>
    `;
    newsList.appendChild(row);
});

// ── 3. Publications ────────────────────────────────────────
function renderPubs(filter) {
    const list   = document.getElementById('pub-list');
    const papers = filter === 'selected' ? selectedPapers : allPublications;
    list.innerHTML = '';

    papers.forEach(p => {
        const links = (p.links || []).map(l =>
            `<a href="${l.url}" target="_blank" class="pub-link">${l.text}</a>`
        ).join('');

        const div = document.createElement('div');
        div.className = 'pub-item';
        div.innerHTML = `
            <div class="pub-meta">
                <span class="pub-venue">${p.venue}</span>
                <span class="pub-role">${p.role}</span>
            </div>
            <p class="pub-title">${p.title}</p>
            <p class="pub-authors">${p.authors}</p>
            <p class="pub-desc">${p.description}</p>
            ${links ? `<div class="pub-links">${links}</div>` : ''}
        `;
        list.appendChild(div);
    });
}

document.getElementById('filter-row').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPubs(btn.dataset.filter);
});

renderPubs('selected');

// ── 4. Contact ─────────────────────────────────────────────
const contactGrid = document.getElementById('contact-grid');
[
    {
        title: supportData.mentorshipTitle,
        text:  supportData.mentorshipText,
        label: 'Get in touch',
        href:  'mailto:' + profileData.email,
    },
    {
        title: supportData.collabTitle,
        text:  supportData.collabText,
        label: 'Contact me',
        href:  'mailto:' + profileData.email,
    },
].forEach(box => {
    contactGrid.innerHTML += `
        <div class="contact-box">
            <p class="contact-title">${box.title}</p>
            <p class="contact-text">${box.text}</p>
            <a class="contact-link" href="${box.href}">${box.label} &rarr;</a>
        </div>`;
});

// ── 5. Scroll spy ──────────────────────────────────────────
const sections = ['news', 'publications', 'contact'];
const navLinks  = {};
sections.forEach(id => {
    navLinks[id] = document.querySelector(`[data-section="${id}"]`);
});

const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
        if (entry.isIntersecting) {
            sections.forEach(id => navLinks[id] && navLinks[id].classList.remove('active'));
            const link = navLinks[entry.target.id];
            if (link) link.classList.add('active');
        }
    });
}, { rootMargin: '-20% 0px -60% 0px', threshold: 0 });

sections.forEach(id => {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
});

// Default active state on load
navLinks['news'] && navLinks['news'].classList.add('active');
</script>
</body>
</html>
