<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications | Arshia Hemmat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] },
                    colors: { bg: '#09090b', card: '#18181b', border: '#27272a' }
                }
            }
        }
    </script>
    <body class="bg-bg text-gray-300 min-h-screen p-6 md:p-12 max-w-4xl mx-auto">
        
        <div class="mb-12">
            <a href="index.html" class="text-sm text-gray-500 hover:text-white transition mb-4 inline-block">&larr; Back to Home</a>
            <h1 class="text-3xl font-bold text-white">Full Publications List</h1>
        </div>

        <div id="all-papers-container" class="space-y-6">
            </div>

        <script src="content.js"></script>
        <script>
            const container = document.getElementById('all-papers-container');
            const getBadgeClass = (color) => {
                const map = { blue: 'bg-blue-500/10 text-blue-400 border-blue-500/20', emerald: 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20', purple: 'bg-purple-500/10 text-purple-400 border-purple-500/20', gray: 'bg-white/5 text-gray-400 border-white/10' };
                return map[color] || map.gray;
            };

            allPublications.forEach(paper => {
                let linksHtml = paper.links.map(l => `<a href="${l.url}" class="text-xs font-medium text-white bg-white/10 px-3 py-1 rounded hover:bg-white/20 transition">${l.text}</a>`).join('');
                container.innerHTML += `
                    <div class="border-b border-white/10 pb-6 last:border-0">
                        <div class="flex flex-wrap gap-2 mb-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border ${getBadgeClass(paper.badgeColor)}">${paper.venue}</span>
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2">${paper.title}</h3>
                        <p class="text-xs text-gray-500 mb-2 font-mono">${paper.authors}</p>
                        <p class="text-sm text-gray-400 mb-3">${paper.description}</p>
                        <div class="flex gap-2">${linksHtml}</div>
                    </div>`;
            });
        </script>
    </body>
</html>
