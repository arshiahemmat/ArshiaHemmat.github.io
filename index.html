<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arshia Hemmat</title>
    <meta name="description" content="Arshia Hemmat — MSc Oxford · Incoming PhD Cambridge · AI for Biology">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg:       #08080f;
    --bg2:      #0d0d1a;
    --card:     #111120;
    --border:   #1c1c2e;
    --text:     #e8e8f4;
    --muted:    #7878a0;
    --faint:    #3a3a58;
    --yellow:   #fbbf24;
    --cyan:     #22d3ee;
    --violet:   #a78bfa;
    --blue:     #60a5fa;
    --green:    #34d399;
    --pink:     #f472b6;
}

html { font-size: 16px; scroll-behavior: smooth; }

body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
}

a { color: var(--blue); text-decoration: none; }
a:hover { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }

/* ═══════════════════════════════════════════
   STARS BACKGROUND
═══════════════════════════════════════════ */
#stars-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.star {
    position: absolute;
    border-radius: 50%;
    background: #ffffff;
    animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
    opacity: var(--op, .5);
}

@keyframes twinkle {
    from { opacity: var(--op, .5); transform: scale(1); }
    to   { opacity: calc(var(--op, .5) * .25); transform: scale(.85); }
}

/* ═══════════════════════════════════════════
   INTRO
═══════════════════════════════════════════ */
#intro {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    transition: opacity .6s ease;
}

#intro.fade-out {
    opacity: 0;
    pointer-events: none;
}

/* Skip button */
#skip-btn {
    position: absolute;
    top: 24px;
    right: 28px;
    font-size: 12px;
    color: var(--faint);
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    letter-spacing: .05em;
    border: 1px solid var(--faint);
    padding: 4px 12px;
    border-radius: 4px;
    transition: all .15s;
    background: transparent;
}
#skip-btn:hover { color: var(--muted); border-color: var(--muted); }

/* Pac-Man track */
.pac-track-wrap {
    display: flex;
    align-items: center;
    position: relative;
    width: 560px;
    max-width: 90vw;
    height: 60px;
}

.pac-sprite {
    width: 44px;
    height: 44px;
    background: var(--yellow);
    border-radius: 50%;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    animation:
        pac-chomp .22s ease-in-out infinite alternate,
        pac-move  2.4s linear forwards;
    z-index: 2;
}

@keyframes pac-chomp {
    from { clip-path: polygon(50% 50%, 100% 18%, 100% 0%, 0% 0%, 0% 100%, 100% 100%, 100% 82%); }
    to   { clip-path: polygon(50% 50%, 100% 46%, 100% 0%, 0% 0%, 0% 100%, 100% 100%, 100% 54%); }
}

@keyframes pac-move {
    0%   { left: 0px; }
    100% { left: calc(100% - 44px); }
}

.pac-dots-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    padding: 0 58px 0 58px;
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
}

.pac-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--yellow);
    opacity: .7;
    transition: transform .08s ease, opacity .08s ease;
    flex-shrink: 0;
}

.pac-dot.eaten {
    transform: scale(0);
    opacity: 0;
}

/* Intro title */
.intro-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(2.2rem, 8vw, 4rem);
    font-weight: 700;
    letter-spacing: -.02em;
    color: var(--text);
    text-align: center;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
    line-height: 1.1;
}

.intro-title.visible { opacity: 1; transform: translateY(0); }

.intro-title .hl-cyan   { color: var(--cyan); }
.intro-title .hl-violet { color: var(--violet); }

.intro-sub {
    font-size: 14px;
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .5s ease .2s;
    font-family: 'Space Grotesk', sans-serif;
}
.intro-sub.visible { opacity: 1; }

/* ═══════════════════════════════════════════
   MAIN
═══════════════════════════════════════════ */
#main {
    position: relative;
    z-index: 10;
    opacity: 0;
    transition: opacity .7s ease;
    max-width: 740px;
    margin: 0 auto;
    padding: 72px 28px 96px;
}

#main.visible { opacity: 1; }

/* ─── HERO ─────────────────────────────── */
.hero {
    display: flex;
    align-items: flex-start;
    gap: 36px;
    margin-bottom: 64px;
}

.hero-photo-wrap {
    flex-shrink: 0;
    position: relative;
}

.hero-photo-wrap::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 16px;
    background: conic-gradient(var(--cyan), var(--violet), var(--yellow), var(--cyan));
    animation: spin-ring 6s linear infinite;
    z-index: 0;
}

@keyframes spin-ring {
    to { transform: rotate(360deg); }
}

.hero-photo {
    display: block;
    width: 96px;
    height: 96px;
    border-radius: 13px;
    object-fit: cover;
    border: 3px solid var(--bg);
    position: relative;
    z-index: 1;
}

.hero-body { flex: 1; min-width: 0; }

.hero-name {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(1.9rem, 5vw, 2.8rem);
    font-weight: 700;
    letter-spacing: -.03em;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 10px;
}

.hero-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 14px;
}

.badge {
    font-size: 11.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: .01em;
}

.badge-cyan   { color: var(--cyan);   border-color: color-mix(in srgb, var(--cyan)   40%, transparent); background: color-mix(in srgb, var(--cyan)   8%, transparent); }
.badge-violet { color: var(--violet); border-color: color-mix(in srgb, var(--violet) 40%, transparent); background: color-mix(in srgb, var(--violet) 8%, transparent); }

.hero-bio {
    font-size: 14.5px;
    color: var(--muted);
    line-height: 1.7;
    max-width: 520px;
    margin-bottom: 22px;
}

.hero-bio strong { color: var(--text); font-weight: 600; }

/* Icon links */
.icon-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.icon-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--card);
    text-decoration: none;
    transition: all .15s ease;
    font-family: 'Space Grotesk', sans-serif;
}

.icon-link svg { width: 15px; height: 15px; flex-shrink: 0; }

.icon-link:hover {
    border-color: var(--faint);
    color: var(--text);
    background: color-mix(in srgb, var(--text) 6%, var(--card));
    text-decoration: none;
}

.icon-link-primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
}
.icon-link-primary:hover {
    background: #d0d0e0;
    border-color: #d0d0e0;
    color: var(--bg);
}

/* ─── SECTION ──────────────────────────── */
.section { margin-bottom: 60px; }

.section-label {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 20px;
}

/* ─── NEWS ─────────────────────────────── */
.news-list { display: flex; flex-direction: column; }

.news-row {
    display: grid;
    grid-template-columns: 82px 1fr;
    gap: 16px;
    padding: 11px 10px;
    border-radius: 7px;
    margin: 0 -10px;
    transition: background .12s ease;
}

.news-row:hover { background: var(--card); }

.news-row.milestone {
    background: color-mix(in srgb, var(--yellow) 7%, transparent);
    border: 1px solid color-mix(in srgb, var(--yellow) 20%, transparent);
}
.news-row.milestone:hover {
    background: color-mix(in srgb, var(--yellow) 12%, transparent);
}

.news-date {
    font-size: 12px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    padding-top: 1px;
    white-space: nowrap;
    font-family: 'Inter', monospace;
}

.news-content {
    font-size: 13.5px;
    color: var(--text);
    line-height: 1.55;
}

.news-content a {
    font-size: 12px;
    margin-left: 6px;
    color: var(--blue);
}

/* ─── PUBLICATIONS ─────────────────────── */
.filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 24px;
}

.filter-btn {
    font-size: 12.5px;
    font-weight: 600;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all .15s ease;
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: .02em;
}

.filter-btn:hover { border-color: var(--faint); color: var(--text); }

.filter-btn.active {
    background: var(--text);
    border-color: var(--text);
    color: var(--bg);
}

.pub-list { display: flex; flex-direction: column; }

.pub-item {
    padding: 20px 14px;
    border-radius: 10px;
    margin: 0 -14px;
    transition: background .15s ease;
    border-bottom: 1px solid var(--border);
}

.pub-item:first-child { border-top: 1px solid var(--border); }
.pub-item:hover { background: var(--card); }

.pub-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 7px;
}

.pub-venue {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    font-family: 'Space Grotesk', sans-serif;
}

.venue-blue   { color: var(--blue); }
.venue-violet { color: var(--violet); }
.venue-cyan   { color: var(--cyan); }
.venue-green  { color: var(--green); }
.venue-muted  { color: var(--muted); }
.venue-yellow { color: var(--yellow); }

.pub-role {
    font-size: 11px;
    font-weight: 500;
    color: var(--faint);
    background: color-mix(in srgb, var(--text) 6%, transparent);
    border: 1px solid var(--border);
    padding: 1px 7px;
    border-radius: 3px;
    font-family: 'Space Grotesk', sans-serif;
}

.pub-title {
    font-size: 14.5px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
    letter-spacing: -.01em;
    font-family: 'Space Grotesk', sans-serif;
}

.pub-authors {
    font-size: 12px;
    color: var(--faint);
    margin-bottom: 6px;
}

.pub-desc {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 10px;
}

.pub-links { display: flex; gap: 7px; flex-wrap: wrap; }

.pub-link {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 4px 12px;
    border-radius: 5px;
    text-decoration: none;
    background: transparent;
    transition: all .15s ease;
    font-family: 'Space Grotesk', sans-serif;
}

.pub-link:hover {
    background: var(--card);
    border-color: var(--faint);
    color: var(--text);
    text-decoration: none;
}

/* ─── CONTACT ──────────────────────────── */
.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.contact-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 20px;
    transition: border-color .15s;
}

.contact-box:hover { border-color: var(--faint); }

.contact-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    font-family: 'Space Grotesk', sans-serif;
}

.contact-text {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.65;
    margin-bottom: 14px;
}

.contact-link {
    font-size: 13px;
    font-weight: 600;
    color: var(--blue);
    text-decoration: none;
    font-family: 'Space Grotesk', sans-serif;
}
.contact-link:hover { color: #93c5fd; text-decoration: underline; text-underline-offset: 3px; }

/* ─── FOOTER ───────────────────────────── */
.footer {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--faint);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}

.footer a { color: var(--faint); }
.footer a:hover { color: var(--muted); }

/* ─── RESPONSIVE ───────────────────────── */
@media (max-width: 560px) {
    .hero { flex-direction: column; gap: 20px; }
    .hero-photo-wrap::before { inset: -2px; }
    .hero-photo { width: 76px; height: 76px; }
    .contact-grid { grid-template-columns: 1fr; }
    .pac-dots-row { padding: 0 48px; }
    .pac-sprite { width: 38px; height: 38px; }
}
</style>
</head>

<div id="stars-bg"></div>

<!-- ═══════════════════════════════════════
     INTRO SCREEN
═══════════════════════════════════════ -->
<div id="intro">
    <button id="skip-btn" onclick="skipIntro()">skip →</button>

    <div class="pac-track-wrap">
        <div class="pac-sprite" id="pac-sprite"></div>
        <div class="pac-dots-row" id="pac-dots-row"></div>
    </div>

    <div>
        <div class="intro-title" id="intro-title">
            Arshia <span class="hl-cyan">Hemmat</span>
        </div>
        <div class="intro-sub" id="intro-sub">AI for Biology · Oxford · Cambridge</div>
    </div>
</div>

<!-- ═══════════════════════════════════════
     MAIN CONTENT
═══════════════════════════════════════ -->
<div id="main">

    <!-- ── HERO ── -->
    <header class="hero">
        <div class="hero-photo-wrap">
            <img src="images/profile.jpg" alt="Arshia Hemmat" class="hero-photo">
        </div>

    <section class="section" id="news">
        <p class="section-label">News</p>

    <section class="section" id="publications">
        <p class="section-label">Publications</p>

        <p class="section-label">Contact</p>
        <div class="contact-grid" id="contact-grid"></div>
    </section>

    <footer class="footer">
        <span>&copy; <span id="year"></span> Arshia Hemmat</span>
        <a id="footer-scholar" href="" target="_blank">Google Scholar</a>

</div>

<script>
// ──────────────────────────────────────────
// 1. STARS
// ──────────────────────────────────────────
(function() {
    const bg = document.getElementById('stars-bg');
    for (let i = 0; i < 160; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 1.8 + 0.4;
        s.style.cssText = `
            left: ${Math.random()*100}%;
            top: ${Math.random()*100}%;
            width: ${size}px;
            height: ${size}px;
            --op: ${(Math.random()*.5 + .15).toFixed(2)};
            --dur: ${(Math.random()*3 + 2).toFixed(1)}s;
            animation-delay: ${(Math.random()*4).toFixed(1)}s;
        `;
        bg.appendChild(s);
    }
})();


// ──────────────────────────────────────────
// 2. PAC-MAN INTRO
// ──────────────────────────────────────────
const DOT_COUNT = 16;
const PAC_DURATION_MS = 2400;

// Build dots
const dotsRow = document.getElementById('pac-dots-row');
for (let i = 0; i < DOT_COUNT; i++) {
    const d = document.createElement('div');
    d.className = 'pac-dot';
    d.id = 'dot-' + i;
    dotsRow.appendChild(d);
}

// Schedule dot eating: Pac-Man starts at left and takes PAC_DURATION_MS to cross
// The dots span from ~10% to ~90% of the track, so adjust timing proportionally
function scheduleDots() {
    for (let i = 0; i < DOT_COUNT; i++) {
        const frac = (i + 1) / (DOT_COUNT + 1); // fraction along the track
        const delay = frac * PAC_DURATION_MS;
        setTimeout(() => {
            const d = document.getElementById('dot-' + i);
            if (d) d.classList.add('eaten');
        }, delay);
    }
}

// After Pac-Man finishes, show the name
setTimeout(() => {
    document.getElementById('intro-title').classList.add('visible');
    document.getElementById('intro-sub').classList.add('visible');
}, PAC_DURATION_MS + 100);

// After name visible, dismiss intro and show main
setTimeout(() => showMain(), PAC_DURATION_MS + 1000);

function showMain() {
    document.getElementById('intro').classList.add('fade-out');
    setTimeout(() => {
        document.getElementById('intro').style.display = 'none';
        document.getElementById('main').classList.add('visible');
    }, 600);
}

function skipIntro() {
    // Clear all timeouts by scheduling showMain immediately
    showMain();
    document.getElementById('intro-title').classList.add('visible');
    document.getElementById('intro-sub').classList.add('visible');
}

// Start the dot-eating sequence immediately
scheduleDots();


// ──────────────────────────────────────────
// 3. HERO
// ──────────────────────────────────────────
document.getElementById('hero-name').textContent = profileData.firstName + ' ' + profileData.lastName;
document.getElementById('footer-scholar').href    = profileData.scholarLink;
document.getElementById('year').textContent       = new Date().getFullYear();

// Badges
const badgesEl = document.getElementById('hero-badges');
badgesEl.innerHTML = `
    <span class="badge badge-cyan">MSc Advanced CS · <strong>Oxford University</strong></span>
    <span class="badge badge-violet">Incoming PhD · <strong>Cambridge University</strong></span>
`;

// Bio
document.getElementById('hero-bio').innerHTML = profileData.bio
    .replace('AI for Biology', '<strong>AI for Biology</strong>')
    .replace('University of Cambridge', '<strong>University of Cambridge</strong>')
    .replace('Oxford', '<strong>Oxford</strong>');

// Icon links
const ICONS = {
    cv: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M7 21h10a2 2 0 002-2V7l-5-5H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`,
    email: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`,

// ──────────────────────────────────────────
// 5. PUBLICATIONS
// ──────────────────────────────────────────
const VENUE_COLOR = {
    'NeurIPS':   'venue-blue',
    'AACL':      'venue-violet',
    'arXiv':     'venue-muted',
    'ArXiv':     'venue-muted',
    'NeurIPS 2025': 'venue-cyan',
    'Under Review': 'venue-yellow',
    'IKT':       'venue-green',
    'CSICC':     'venue-green',
    'IEEE':      'venue-cyan',
    'Frontiers': 'venue-green',
    'ICLR':      'venue-violet',
};

function getVenueColor(venue) {
    for (const [key, cls] of Object.entries(VENUE_COLOR)) {
        if (venue.includes(key)) return cls;
    }
    return 'venue-muted';
}

function renderPubs(filter) {
    const list   = document.getElementById('pub-list');
    const papers = filter === 'selected' ? selectedPapers : allPublications;
    list.innerHTML = '';
    papers.forEach(p => {
        const links = (p.links || []).map(l =>
            `<a href="${l.url}" target="_blank" class="pub-link">${l.text}</a>`
        ).join('');
        const div = document.createElement('div');
        div.className = 'pub-item';
        div.innerHTML = `
            <div class="pub-meta">
                <span class="pub-venue ${getVenueColor(p.venue)}">${p.venue}</span>
                <span class="pub-role">${p.role}</span>
            </div>
            <p class="pub-title">${p.title}</p>
            <p class="pub-authors">${p.authors}</p>
            <p class="pub-desc">${p.description}</p>
            ${links ? `<div class="pub-links">${links}</div>` : ''}
        `;
        list.appendChild(div);
    });
}

document.getElementById('filter-row').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPubs(btn.dataset.filter);
});

renderPubs('selected');
